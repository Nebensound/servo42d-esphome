# ESP32 hardware compilation test
# This test compiles the component for actual ESP32 hardware
# Use this to verify that all hardware-specific features compile correctly
#
# Run with: esphome compile tests/test_compile.yaml

esphome:
  name: servo42d-esp32-test
  friendly_name: "Servo42D ESP32 Test"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Load component from local directory
external_components:
  - source:
      type: local
      path: ../components
    components: [servo42d_rs485]

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms # Shorter delay for faster communication

# Servo42D RS485 Stepper Motor
stepper:
  - platform: servo42d_rs485
    id: test_stepper
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2
    deceleration: 500 steps/s^2

    # MODBUS configuration
    modbus_id: modbus_bus
    address: 0x01
    update_interval: 1s

# Test Buttons for Actions
button:
  - platform: template
    name: "Enable Motor"
    on_press:
      - servo42d_rs485.enable_motor:
          id: test_stepper
          enable: true

  - platform: template
    name: "Disable Motor"
    on_press:
      - servo42d_rs485.enable_motor:
          id: test_stepper
          enable: false

  - platform: template
    name: "Emergency Stop"
    on_press:
      - servo42d_rs485.emergency_stop:
          id: test_stepper

  - platform: template
    name: "Release Protection"
    on_press:
      - servo42d_rs485.release_protection:
          id: test_stepper

  - platform: template
    name: "Calibrate Motor"
    on_press:
      - servo42d_rs485.calibrate:
          id: test_stepper

  - platform: template
    name: "Go to Zero"
    on_press:
      - servo42d_rs485.go_to_zero:
          id: test_stepper
          enable: true
          speed: 500
          direction: 0

  - platform: template
    name: "Set CR_VREF Mode"
    on_press:
      - servo42d_rs485.set_work_mode:
          id: test_stepper
          mode: 0 # CR_VREF

  - platform: template
    name: "Set Working Current 1000mA"
    on_press:
      - servo42d_rs485.set_working_current:
          id: test_stepper
          current: 1000

# Test sensors to verify compilation
sensor:
  - platform: template
    name: "Motor Status Test"
    lambda: |-
      return 0;
    update_interval: 60s

# Test script with multiple actions
script:
  - id: test_motor_sequence
    then:
      - servo42d_rs485.enable_motor:
          id: test_stepper
          enable: true
      - delay: 1s
      - stepper.set_target:
          id: test_stepper
          target: 1000
      - delay: 2s
      - servo42d_rs485.emergency_stop:
          id: test_stepper
      - delay: 1s
      - servo42d_rs485.release_protection:
          id: test_stepper
