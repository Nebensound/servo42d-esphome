substitutions:
  full_steps: 200
  microsteps: 16

esphome:
  name: servo42d-movement-test
  friendly_name: Servo42D Movement Test
  on_boot:
    priority: -100 # Run after everything is initialized
    then:
      - logger.log: "=== MOTOR MOVEMENT TEST ==="
      - delay: 5s # Wait for motor setup to complete

      # Stop any ongoing movement from setup
      - lambda: |-
          id(test_motor).stop_motor();
          ESP_LOGI("test", "Motor stopped");
      - delay: 2s
      # Reset position to 0 after motor is stopped
      - stepper.report_position:
          id: test_motor
          position: 0
      - logger.log: "Position reset to 0"
      - delay: 1s

      # Enable motor
      - stepper.enable: test_motor
      - delay: 2s

      # Small, slow movement: 1 full rotation (3200 steps at 16 microsteps)
      - logger.log: "Starting slow rotation (1 turn)..."
      - lambda: |-
          ESP_LOGI("test", "Current position before move: %d", (int)id(test_motor).current_position);
          ESP_LOGI("test", "Target position before move: %d", (int)id(test_motor).target_position);

      - stepper.set_target:
          id: test_motor
          target: 3200 # 1 full rotation

      - delay: 1s
      - lambda: |-
          ESP_LOGI("test", "Target position after set_target: %d", (int)id(test_motor).target_position);
          ESP_LOGI("test", "Current position 1s after: %d", (int)id(test_motor).current_position);

      # Wait for movement to complete (~32 seconds at 100 steps/s)
      - delay: 35s

      - logger.log: "Movement complete!"
      - lambda: |-
          ESP_LOGI("test", "Final position: %d", (int)id(test_motor).current_position);

      # Disable motor to stop holding torque
      - stepper.disable: test_motor
      - logger.log: "Test finished. Motor disabled."

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

# OTA and WiFi required for testing
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Servo42D-Test"
    password: "test1234"

# Web server for easy access
web_server:

# UART configuration for RS485
uart:
  id: rs485_uart
  tx_pin: GPIO13
  rx_pin: GPIO16
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false

# Modbus configuration
modbus:
  id: modbus_rs485
  uart_id: rs485_uart
  send_wait_time: 50ms

# External component (local path)
external_components:
  - source:
      type: local
      path: ../components
    components: [servo42d_rs485]

stepper:
  - platform: servo42d_rs485
    id: test_motor
    modbus_id: modbus_rs485
    address: 0x02

    # Motor parameters
    steps_per_revolution: ${full_steps * microsteps}
    microsteps: ${microsteps}
    max_speed: 3000 steps/min
    acceleration: 200 steps/s^2
    deceleration: 200 steps/s^2

    # Current settings
    working_current: 1500mA
    holding_current_percent: 50%

    # Homing configuration
    homing_direction: CW
    homing_speed: 300 RPM
    virtual_home_angle: 0deg

# Position sensor - reports every 1 second
sensor:
  - platform: template
    name: "Motor Position"
    id: motor_position_sensor
    unit_of_measurement: "steps"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(test_motor).current_position;

# Restart button for the automation
button:
  - platform: restart
    id: restart_button
    name: "Restart Device"
