# Host platform compilation test
# This test compiles the component without requiring actual hardware
# Useful for CI/CD pipelines and quick syntax validation
#
# Run with: esphome compile tests/test_compile_host.yaml

esphome:
  name: servo42d-host-test
  friendly_name: "Servo42D Host Test"

# Use host platform for fast compilation without hardware
host:

# Load component from local directory
external_components:
  - source:
      type: local
      path: ../components
    components: [servo42d_rs485]

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication (dummy for host - no pins needed)
uart:
  id: uart_bus
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# Servo42D RS485 Stepper Motor
stepper:
  - platform: servo42d_rs485
    id: test_stepper
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2
    deceleration: 500 steps/s^2

    # MODBUS configuration
    address: 0x01
    uart_id: uart_bus
    update_interval: 1s
