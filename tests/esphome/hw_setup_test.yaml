substitutions:
  full_steps: 200
  microsteps: 16

esphome:
  name: servo42d-setup-test
  friendly_name: Servo42D Setup Test
  on_boot:
    priority: -100 # Run after everything is initialized
    then:
      - logger.log: "=== HARDWARE SETUP & ENCODER TEST STARTED ==="
      - delay: 20s # Wait for setup sequence to complete (7 steps)
      - logger.log: "=== SETUP TEST COMPLETE ==="
      - logger.log: "Check logs above for 7x 'OK' messages from setup sequence"

      # Disable motor first to prevent unintended movement
      - stepper.disable: test_motor
      - delay: 2s

      # Test encoder reading
      - logger.log: "=== ENCODER TEST START ==="
      - logger.log: "Motor is DISABLED - you can turn it manually"
      - logger.log: "Watching position values for 30 seconds..."
      - lambda: |-
          ESP_LOGI("test", "Initial position: %d", (int)id(test_motor).current_position);

      # Watch encoder for 30 seconds while user turns motor manually
      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 5s: Position=%d", 
                   (int)id(test_motor).current_position);

      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 10s: Position=%d", 
                   (int)id(test_motor).current_position);

      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 15s: Position=%d", 
                   (int)id(test_motor).current_position);

      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 20s: Position=%d", 
                   (int)id(test_motor).current_position);

      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 25s: Position=%d", 
                   (int)id(test_motor).current_position);

      - delay: 5s
      - lambda: |-
          ESP_LOGI("test", "After 30s (FINAL): Position=%d", 
                   (int)id(test_motor).current_position);

      - logger.log: "=== ENCODER TEST COMPLETE ==="
      - delay: 3s
      - button.press: restart_esp

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO # Clear visibility of setup steps

# WiFi (optional, for remote monitoring)
# WiFi credentials are stored in secrets.yaml (not committed to git)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Servo42D Setup Test"
    password: !secret fallback_ap_password

# Enable Home Assistant API (optional)
api:

# Enable OTA updates (optional)
ota:
  - platform: esphome

# Web server for easy access
web_server:

# UART configuration for RS485
uart:
  id: rs485_uart
  tx_pin: GPIO13
  rx_pin: GPIO16
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false

# Modbus configuration
modbus:
  id: modbus_rs485
  uart_id: rs485_uart
  send_wait_time: 50ms

# External component (local path)
external_components:
  - source:
      type: local
      path: ../../components
    components: [servoxxd]

# ServoXxD Stepper Motor
stepper:
  - platform: servoxxd
    id: test_motor
    modbus_id: modbus_rs485
    address: 0x02
    servo_type: SERVO42D
    mode: POSITION

    # Basic configuration
    steps_per_revolution: ${ full_steps * microsteps } # 200 * 16 = 3200 steps/rev
    microsteps: ${ microsteps }
    speed: 100 steps/s
    acceleration: 100 steps/s^2

# Sensors to monitor status
sensor:
  - platform: template
    name: "Motor Position"
    lambda: |-
      return id(test_motor).current_position;
    update_interval: 1s
    unit_of_measurement: "steps"

# Simple control buttons
button:
  - platform: restart
    name: "Restart ESP"
    id: restart_esp

  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: test_motor
