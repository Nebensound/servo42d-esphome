substitutions:
  full_steps: 200
  microsteps: 16

esphome:
  name: servo42d-setup-test
  friendly_name: Servo42D Setup Test
  on_boot:
    priority: -100
    then:
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - lambda: 'ESP_LOGI("test", "  SERVO42D HARDWARE FUNCTION TEST");'
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - delay: 3s

      # SETUP: Clear any error states and prepare motor
      - lambda: 'ESP_LOGI("test", "SETUP: Initializing motor hardware...");'
      - lambda: 'ESP_LOGI("test", "  -> Clearing any error states...");'
      - lambda: |-
          id(test_motor)->release_protection();
      - delay: 1s
      - lambda: 'ESP_LOGI("test", "  -> Enabling motor...");'
      - stepper.enable: test_motor
      - delay: 1s

      - lambda: |-
          ESP_LOGI("test", "  -> Motor ready at position: %d", (int)id(test_motor).current_position);
      - lambda: 'ESP_LOGI("test", "  SETUP COMPLETE");'
      - delay: 2s

      # Run main test sequence
      - script.execute: run_all_tests

# Test Scripts - Each test is separate
script:
  # ========================================
  # TEST 1: Basic Enable/Disable Test
  # ========================================
  - id: test_1_enable_disable
    mode: single
    then:
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - lambda: 'ESP_LOGI("test", "TEST 1: Motor Enable/Disable");'
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - delay: 1s

      # Test disable
      - lambda: 'ESP_LOGI("test", "  -> Disabling motor...");'
      - stepper.disable: test_motor
      - delay: 2s
      - lambda: 'ESP_LOGI("test", "  -> Motor disabled (shaft should move freely)");'
      - delay: 2s

      # Test enable
      - lambda: 'ESP_LOGI("test", "  -> Enabling motor...");'
      - stepper.enable: test_motor
      - delay: 2s
      - lambda: 'ESP_LOGI("test", "  -> Motor enabled (you should feel holding torque)");'
      - delay: 2s

      - lambda: 'ESP_LOGI("test", "  ✓ TEST 1 PASSED");'
      - delay: 1s

  # ========================================
  # TEST 2: Small Movement Test (200 steps)
  # ========================================
  - id: test_2_small_movement
    mode: single
    then:
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - lambda: 'ESP_LOGI("test", "TEST 2: Small Movement (200 steps forward)");'
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - delay: 1s

      - lambda: |-
          int start_pos = (int)id(test_motor).current_position;
          ESP_LOGI("test", "  -> Start position: %d steps", start_pos);

      - lambda: |-
          // Direct C++ call to move_to() with runtime calculation
          float target_pos = id(test_motor).current_position + 200.0f;
          ESP_LOGI("test", "  -> Target position: %.0f steps", target_pos);
          ESP_LOGI("test", "  -> Starting movement...");

          esphome::servoxxd::Position pos(target_pos, esphome::servoxxd::PositionUnit::STEPS, id(test_motor));
          id(test_motor)->move_to(pos);

      - delay: 5s

      - lambda: |-
          int final_pos = (int)id(test_motor).current_position;
          ESP_LOGI("test", "  -> Final position: %d steps", final_pos);

      - lambda: 'ESP_LOGI("test", "  ✓ TEST 2 PASSED");'
      - delay: 1s

  # ========================================
  # Main Test Runner - Calls individual tests
  # ========================================
  - id: run_all_tests
    mode: single
    then:
      # Run TEST 1 (currently disabled)
      #- script.execute: test_1_enable_disable
      #- script.wait: test_1_enable_disable

      # Run TEST 2 only
      - script.execute: test_2_small_movement
      - script.wait: test_2_small_movement

      # All tests complete
      - delay: 2s
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - lambda: 'ESP_LOGI("test", "  ALL TESTS COMPLETED!");'
      - lambda: 'ESP_LOGI("test", "==========================================");'
      - delay: 5s
      - lambda: 'ESP_LOGI("test", "System will restart in 3 seconds...");'
      - delay: 3s
      - button.press: restart_esp

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    # Show UART debug output
    uart.idf: DEBUG
    uart: DEBUG
    # Reduce noise from other components
    wifi: INFO
    api: INFO
    mdns: WARN
    esp-idf: WARN
    # Reduce spam during tests
    servoxxd.queue: INFO
    servoxxd.modbus: INFO
    sensor: INFO
    component: WARN

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Servo42D Setup Test"
    password: !secret fallback_ap_password

# Enable Home Assistant API
api:

# Enable OTA updates
ota:
  - platform: esphome

# Web server for easy access
web_server:

# UART configuration for RS485
uart:
  id: rs485_uart
  tx_pin: GPIO13
  rx_pin: GPIO16
  baud_rate: 9600
  debug:
    direction: BOTH
    dummy_receiver: false

# Modbus configuration
modbus:
  id: modbus_rs485
  uart_id: rs485_uart
  send_wait_time: 50ms

# External component (local path)
external_components:
  - source:
      type: local
      path: ../../components
    components: [servoxxd]

# ServoXxD Stepper Motor
stepper:
  - platform: servoxxd
    id: test_motor
    modbus_id: modbus_rs485
    address: 0x02
    servo_type: SERVO42D
    mode: POSITION
    steps_per_revolution: 3200
    microsteps: 16
    speed: 100 steps/s
    acceleration: 100 steps/s^2

# Sensors to monitor status
sensor:
  - platform: template
    name: "Motor Position"
    lambda: |-
      return id(test_motor).current_position;
    update_interval: 1s
    unit_of_measurement: "steps"

  - platform: template
    name: "Motor Target Position"
    lambda: |-
      return id(test_motor).target_position;
    update_interval: 1s
    unit_of_measurement: "steps"

# Simple control buttons
button:
  - platform: restart
    name: "Restart ESP"
    id: restart_esp

  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: test_motor
      - lambda: 'ESP_LOGI("test", "EMERGENCY STOP activated!");'

  - platform: template
    name: "Enable Motor"
    on_press:
      - stepper.enable: test_motor
      - lambda: 'ESP_LOGI("test", "Motor enabled");'

  - platform: template
    name: "Disable Motor"
    on_press:
      - stepper.disable: test_motor
      - lambda: 'ESP_LOGI("test", "Motor disabled");'

  # Manual test triggers
  - platform: template
    name: "Run Test 1"
    on_press:
      - script.execute: test_1_enable_disable

  - platform: template
    name: "Run Test 2"
    on_press:
      - script.execute: test_2_small_movement

  - platform: template
    name: "Run All Tests"
    on_press:
      - script.execute: run_all_tests
