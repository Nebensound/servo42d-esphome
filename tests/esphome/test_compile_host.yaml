# Host platform compilation test
# This test compiles the component without requiring actual hardware
# Useful for CI/CD pipelines and quick syntax validation
#
# Run with: esphome compile tests/test_compile_host.yaml

esphome:
  name: servoxxd-host-test
  friendly_name: "ServoXXD Host Test"

# Use host platform for fast compilation without hardware
host:

# Load component from local directory
external_components:
  - source:
      type: local
      path: ../../components
    components: [servoxxd]

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication (dummy for host - uses port instead of pins)
uart:
  id: uart_bus
  port: /dev/ttyUSB0 # Dummy port for host platform
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller (required for Servo42D)
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# ServoXxD RS485 Stepper Motor
stepper:
  - platform: servoxxd
    id: test_stepper
    steps_per_revolution: 3200 # 200 steps × 16 microsteps
    speed: 1000 steps/s
    acceleration: 500 steps/s^2
    servo_type: SERVO42D
    mode: POSITION

    # MODBUS configuration
    modbus_id: modbus_bus
    address: 0x01

# Test buttons to verify all actions compile
button:
  # Basic control
  - platform: template
    name: "Enable"
    on_press:
      - stepper.enable: test_stepper

  - platform: template
    name: "Disable"
    on_press:
      - stepper.disable: test_stepper

  # Continuous motion with different units
  - platform: template
    name: "Run - Steps/s"
    on_press:
      - stepper.run_continuous:
          id: test_stepper
          speed: 500 steps/s

  - platform: template
    name: "Run - RPM"
    on_press:
      - stepper.run_continuous:
          id: test_stepper
          speed: 10 RPM

  - platform: template
    name: "Run - RPS"
    on_press:
      - stepper.run_continuous:
          id: test_stepper
          speed: 0.5 RPS

  - platform: template
    name: "Run - Degrees/s"
    on_press:
      - stepper.run_continuous:
          id: test_stepper
          speed: 90 degrees/s

  - platform: template
    name: "Stop"
    on_press:
      - stepper.stop: test_stepper

  # Emergency functions
  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: test_stepper

  - platform: template
    name: "Release Protection"
    on_press:
      - stepper.release_protection: test_stepper

  # Position control
  - platform: template
    name: "Report Position"
    on_press:
      - stepper.report_position:
          id: test_stepper
          position: 0

  # Configuration
  - platform: template
    name: "Set Working Current 2000mA"
    on_press:
      - stepper.set_working_current:
          id: test_stepper
          current: 2000

  - platform: template
    name: "Set Holding Current %"
    on_press:
      - stepper.set_holding_current_percent:
          id: test_stepper
          percent: 50%

  - platform: template
    name: "Set Microstepping"
    on_press:
      - stepper.set_microstepping:
          id: test_stepper
          subdivision: 16

# Test scripts
script:
  - id: test_all_units
    then:
      - stepper.enable: test_stepper
      # Test steps-based units
      - stepper.run_continuous:
          id: test_stepper
          speed: 1000 steps/s
      - delay: 1s
      - stepper.stop: test_stepper

      # Test RPM
      - stepper.run_continuous:
          id: test_stepper
          speed: 20 RPM
      - delay: 1s
      - stepper.stop: test_stepper

      # Test RPS
      - stepper.run_continuous:
          id: test_stepper
          speed: 2 RPS
      - delay: 1s
      - stepper.stop: test_stepper

      # Test degrees/s
      - stepper.run_continuous:
          id: test_stepper
          speed: 360 degrees/s
      - delay: 1s
      - stepper.stop: test_stepper

      - stepper.disable: test_stepper
