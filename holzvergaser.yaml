globals:
  - id: last_save_time
    type: int
    restore_value: yes
    initial_value: "-1"
  - id: saved_avarage_temperature_outside
    type: float
    restore_value: yes
  - id: initiated_avarage_temperature_outside
    type: bool
    initial_value: "false"
number:
  - platform: template
    name: "Neigung HK I"
    id: gradient_hk_i
    optimistic: true
    min_value: 0.2
    max_value: 3.5
    step: 0.1
    restore_value: true
    initial_value: 1.5
  - platform: template
    name: "Niveau HK I"
    id: offset_hk_i
    optimistic: true
    min_value: -5
    max_value: 5
    step: 0.1
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Raumtemperatur Soll HK I"
    id: room_temp_hk_i
    optimistic: true
    min_value: 12
    max_value: 36
    step: 0.1
    restore_value: true
    initial_value: 22
  - platform: template
    name: "Spreizung HK I"
    id: delta_hk_i
    optimistic: true
    min_value: 5
    max_value: 20
    step: 0.1
    restore_value: true
    initial_value: 10
  - platform: template
    name: "Zeitkonstante HK I"
    id: timeconstant
    optimistic: true
    min_value: 1
    max_value: 2000
    step: 10
    restore_value: true
    unit_of_measurement: "min"
    initial_value: 1280
