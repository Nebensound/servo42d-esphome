substitutions:
  gears:
    motor: 9.0
    valve: 44.0

esphome:
  name: holz-vergaser
  friendly_name: Holzvergaser
  # TODO: Remove this on_boot workaround once motor race condition is fixed
  # Currently needed because RESTORE_AND_CALL crashes when motor is not ready
  on_boot:
    priority: -100  # Late boot, after all components initialized
    then:
      - delay: 5s  # Wait for motor setup to complete
      - lambda: |-
          ESP_LOGI("boot", "Restoring valve position after motor setup");
          auto* valve = id(valve_hk_i);
          if (valve && !std::isnan(valve->position)) {
            float pos = valve->position;
            ESP_LOGI("boot", "Calling valve position action with: %.2f", pos);
            auto call = valve->make_call();
            call.set_position(pos);
            call.perform();
          }
  on_shutdown:
    then:
      - lambda: |-
          id(saved_avarage_temperature_outside) = id(avarage_temperature_outside).state;
          id(last_save_time) = id(my_time).now().timestamp;

esp32:
  board: esp32dev
  framework:
    type: esp-idf

status_led:
  pin: GPIO15

packages:
  common: !include common/common.yaml

external_components:
  - source:
      type: local
      path: components
    components: [layered_storage] #three_way_valve
  - source: github://Nebensound/servoxxd-esphome@develop
    components: [servoxxd]
    refresh: 0s

web_server:

uart:
  - id: rs485
    tx_pin: GPIO13
    rx_pin: GPIO16
    baud_rate: 9600

modbus:
  uart_id: rs485
  send_wait_time: 1000ms

stepper:
  - platform: servoxxd
    id: stepper_hk_i
    servo_type: SERVO42D
    mode: POSITION
    address: 0x02
    speed: 10 revolutions/min
    acceleration: 1 revolutions/s^2
    homing:
      mode: ENDSTOP
      at_startup: true
      direction: CCW
      speed: 10 revolutions/min
      endstop_trigger: HIGH

text_sensor:
  - platform: template
    name: "Motor State"
    lambda: |-
      auto* motor = id(stepper_hk_i);
      if (!motor) return {};  // Motor nicht initialisiert
      return motor->get_state_string();
    update_interval: 1s

# Update valve position periodically instead of in every loop
interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto* motor = id(stepper_hk_i);
          if (!motor) {
            return;
          }
          
          float pos_in_rev = motor->get_current_position_revolutions();
          
          if (std::isnan(pos_in_rev)) {
            return;
          }
          
          const float pos_closed = -0.5*${gears.valve}/${gears.motor}/4.0;  // -0.6111 revolutions
          const float pos_open = pos_closed + 0.5*${gears.valve}/${gears.motor}/4.0;  // 0.0 revolutions
          
          float range = pos_open - pos_closed;
          if (std::abs(range) < 0.001) {
            return;
          }
          
          float pos = (pos_in_rev - pos_closed) / range;
          
          // Clamp to 0-1
          pos = std::max(0.0f, std::min(1.0f, pos));
          
          // Update valve state
          auto* valve = id(valve_hk_i);
          if (valve) {
            valve->publish_state(pos);
          }

valve:
#  - platform: three_way_valve
#    name: "Heizkreis I"
#    id: valve_hk_i
#    stepper: stepper_hk_i
#    gear_ratio: ${gears.valve / gears.motor}
#    motor_steps_per_rev: 200
#    ports:
#      supply: 1
#      buffer: 2
#      return: 3
  - platform: template
    name: "Heizkreis I"
    id: valve_hk_i
    device_class: water
    # No lambda here - position is updated via interval above
    open_action:
      - stepper.set_target:
          id: stepper_hk_i
          target:
            value: !lambda |-
              const float pos_closed = -0.5*${gears.valve}/${gears.motor}/4.0;
              const float pos_open = pos_closed + 0.5*${gears.valve}/${gears.motor}/4.0;
              return pos_open;
            unit: REVOLUTIONS
    close_action:
      - stepper.set_target:
          id: stepper_hk_i
          target:
            value: !lambda |-
              const float pos_closed = -0.5*${gears.valve}/${gears.motor}/4.0;
              const float pos_open = pos_closed + 0.5*${gears.valve}/${gears.motor}/4.0;
              return pos_closed;
            unit: REVOLUTIONS
    position_action:
      - stepper.set_target:
          id: stepper_hk_i
          target:
            value: !lambda |-
              const float pos_closed = -0.5*${gears.valve}/${gears.motor}/4.0;
              const float pos_open = pos_closed + 0.5*${gears.valve}/${gears.motor}/4.0;
              return pos_closed + pos * 0.5*${gears.valve}/${gears.motor}/4.0;
            unit: REVOLUTIONS
    has_position: true
    # TODO: Change back to RESTORE_AND_CALL once motor race condition is fixed
    # Currently RESTORE_AND_CALL crashes system when valve restores before motor is ready
    restore_mode: RESTORE

climate:
  - platform: pid
    id: hk_i
    sensor: temp_vorlauf_hk_i
    default_target_temperature: 50°C
    heat_output: valve_hk_i_output
    control_parameters:
      kp: 0.14816 # 0.04939
      ki: 0.00396 # 0.00132
      kd: 1.38519 # 1.15433
      output_averaging_samples: 2
      derivative_averaging_samples: 2
  - platform: pid
    id: hk_i_ruecklauf
    sensor: temp_ruecklauf_hk_i
    default_target_temperature: 50°C
    heat_output: no_output
    cool_output: no_output
    control_parameters:
      kp: 0.01481
      ki: 0.00022 # 0.00039
      kd: 0.13851
      output_averaging_samples: 2
      derivative_averaging_samples: 2
select:
  - platform: template
    name: "HK1 Steuerart"
    id: hk_i_control_mode
    optimistic: true
    restore_value: true
    options:
      - Vorlauf
      - Rücklauf
    initial_option: Vorlauf
button:
  - platform: template
    name: "PID HK I Autotune"
    entity_category: config
    on_press:
      - climate.pid.autotune:
          id: hk_i
          positive_output: 0.8
          negative_output: 0
          noiseband: 0.5
  - platform: template
    name: "PID HK I Rücklauf Autotune"
    entity_category: config
    on_press:
      - climate.pid.autotune:
          id: hk_i_ruecklauf
          positive_output: 0.5
          negative_output: -0.5
          noiseband: 1
  - platform: template
    name: "Außentemperatur gemittelt Reset"
    entity_category: config
    on_press:
      - globals.set:
          id: initiated_avarage_temperature_outside
          value: "false"
      - globals.set:
          id: last_save_time
          value: "-1"

