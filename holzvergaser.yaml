    one_wire_id: HT1
    address: 0xe000000002701a28
    name: "Temperatur HK I Vorlauf"
    id: temp_vorlauf_hk_i
    update_interval: 1s
  - platform: dallas_temp
    one_wire_id: HT1
    address: 0xea3c01e076311328
    name: "Temperatur HK I Rücklauf"
    id: temp_ruecklauf_hk_i
    update_interval: 1s
  - platform: dallas_temp
    one_wire_id: HT2
    address: 0x1f01205f4975d628
    name: "Temperatur Vorlauf gemischt"
    id: temp_vorlauf_gemischt
    update_interval: 1s
    filters:
      - throttle_average: 10s
  - platform: homeassistant
    name: "Außentemperatur"
    id: current_temperature_outside
    entity_id: weather.weierhof
    attribute: temperature
    internal: false
    filters:
      - heartbeat: 10s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - platform: template
    name: "Außentemperatur gemittelt"
    id: avarage_temperature_outside
    update_interval: 1 min
    lambda: |-
      float x = id(current_temperature_outside).state;
      float last_x = id(avarage_temperature_outside).state;
      const float alpha = 1.0 - exp(-1 / id(timeconstant).state);
      if (!id(initiated_avarage_temperature_outside)){
        if ((id(my_time).now().timestamp - id(last_save_time)) < (id(timeconstant).state * 60 / 2) && !std::isnan(id(saved_avarage_temperature_outside))){
          last_x = id(saved_avarage_temperature_outside);
        } else {
          last_x = NAN;
        }
        id(initiated_avarage_temperature_outside) = true;
      }
      if (std::isnan(x) && std::isnan(last_x)){
        return NAN;
      } else if (std::isnan(x)){
        x = last_x;
      } else if (std::isnan(last_x)){
        // x = x;
      } else {
        x = alpha * x + (1.0 - alpha) * last_x;
      }
      if ((id(my_time).now().timestamp - id(last_save_time)) > ((id(timeconstant).state * 60 / 2)-1)){
        id(saved_avarage_temperature_outside) = x;
        id(last_save_time) = id(my_time).now().timestamp;
      }
      return x;
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - platform: template
    name: "Temperatur HK I Vorlauf Soll Raw"
    id: temp_hk_i_vorlauf_soll_raw
    lambda: |-
      float avarage_outsidetemp = id(avarage_temperature_outside).state;
      float outsidetemp = id(current_temperature_outside).state;
      float room_temp = id(room_temp_hk_i).state;
      float offset = id(offset_hk_i).state;
      float gradient = id(gradient_hk_i).state;
      if (std::isnan(avarage_outsidetemp)||std::isnan(outsidetemp)||std::isnan(room_temp)||std::isnan(offset)||std::isnan(gradient)){
        return {};
      }
      float gemischte_at = avarage_outsidetemp * 0.7 + outsidetemp * 0.3;
      float dar = gemischte_at - room_temp;
      return room_temp + offset - gradient * dar * (1.4347 + 0.021 * dar + 0.0002479 * dar * dar);
    update_interval: 1s
    filters:
      - throttle_average: 10s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    on_value:
      - if:
          condition:
            lambda: "return !std::isnan(id(delta_hk_i).state);"
          then:
            - climate.control:
                id: hk_i_ruecklauf
                target_temperature: !lambda |-
                  return x - id(delta_hk_i).state;
  - platform: pid
    name: "Temperatur HK I Vorlauf Soll"
    id: temp_hk_i_vorlauf_soll
    type: RESULT
    climate_id: hk_i_ruecklauf
    filters:
      - lambda: |-

          auto control_mode = id(hk_i_control_mode).current_option();
          if (control_mode == "Rücklauf") {
              float soll = id(temp_hk_i_vorlauf_soll_raw).state;
              float delta = id(delta_hk_i).state;
              if (std::isnan(soll) || std::isnan(delta) || std::isnan(x)) {
                  return {};
              }
              float offset = std::max(std::min(x, (float)100.0), (float)-100.0) / 100.0 * delta * 0.5;
              return soll + offset;
          } else if (control_mode == "Vorlauf") {
              float soll = id(temp_hk_i_vorlauf_soll_raw).state;
              if (std::isnan(soll)) {
                  return {};
              }
              return soll;
          } else {
              return {};
          }

    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    on_value:
      - climate.control:
          id: hk_i
          target_temperature: !lambda "return x;"
    icon: mdi:thermometer
  - platform: template
    name: "Position Stepper"
    id: position
    update_interval: 1s
    lambda: !lambda "return id(stepper_hk_i)->get_current_position_steps();"
    state_class: measurement
  - platform: template
    name: "Ziel Position Stepper"
    id: targetposition
    update_interval: 1s
    lambda: !lambda "return id(stepper_hk_i)->get_target_position_steps();"
    state_class: measurement
  - platform: template
    name: "Temperatur Delta"
    lambda: |-
      return id(temp_ruecklauf).state - id(temp_vorlauf_gemischt).state;
    update_interval: 1s
    filters:
      - throttle_average: 10s
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - platform: adc
    name: Anlagendruck
    device_class: "pressure"
    pin: GPIO36
    unit_of_measurement: bar
    attenuation: 6db
    samples: 10
    update_interval: 1s
    filters:
      - calibrate_linear:
          - 0.6 -> 0.0
          - 3.0 -> 10.0
      - clamp:
          min_value: 0.0
          max_value: 10.0
          ignore_out_of_range: true
      - throttle_average: 1s
