# Basic Servo42D RS485 Stepper Motor Example
#
# This example shows the minimal configuration needed to control
# a MKS Servo42D/57D motor via RS485/MODBUS-RTU
#
# Hardware Setup:
# - ESP32 UART TX (GPIO17) -> RS485 DI (Data Input)
# - ESP32 UART RX (GPIO16) -> RS485 RO (Receiver Output)
# - RS485 A/B -> Motor A/B terminals
# - Motor must be pre-configured via display buttons:
#   * MODBUS-RTU enabled (register 0x008E = 1)
#   * Correct baud rate (38400 recommended)
#   * Motor address (default: 1)
#   * Work mode set to SR_vFOC (mode 5)

esphome:
  name: servo42d-basic
  friendly_name: "Servo42D Basic Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Load component (adjust path if needed)
external_components:
  - source:
      type: local
      path: ../components
    components: [servo42d_rs485]

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication
# Adjust pins according to your hardware
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Servo42D RS485 Stepper Motor
stepper:
  - platform: servo42d_rs485
    id: my_stepper
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2
    deceleration: 500 steps/s^2

    # MODBUS configuration
    modbus_id: modbus_bus
    address: 0x01
    # Optional: configure update interval for status polling
    update_interval: 1s

# =============================================================================
# Example Buttons using Actions
# =============================================================================

button:
  # Basic motor control
  - platform: template
    name: "Enable Motor"
    on_press:
      - servo42d_rs485.enable_motor:
          id: my_stepper
          enable: true

  - platform: template
    name: "Disable Motor"
    on_press:
      - servo42d_rs485.enable_motor:
          id: my_stepper
          enable: false

  # Emergency functions
  - platform: template
    name: "Emergency Stop"
    on_press:
      - servo42d_rs485.emergency_stop:
          id: my_stepper

  - platform: template
    name: "Release Protection"
    on_press:
      - servo42d_rs485.release_protection:
          id: my_stepper

  # Calibration
  - platform: template
    name: "Calibrate Motor"
    on_press:
      - servo42d_rs485.calibrate:
          id: my_stepper

  - platform: template
    name: "Go to Zero Position"
    on_press:
      - servo42d_rs485.go_to_zero:
          id: my_stepper
          enable: true
          speed: 500
          direction: 0

# =============================================================================
# Example Script: Motor startup sequence
# =============================================================================

script:
  - id: motor_startup
    then:
      - logger.log: "Starting motor initialization..."
      - servo42d_rs485.enable_motor:
          id: my_stepper
          enable: true
      - delay: 500ms
      - servo42d_rs485.calibrate:
          id: my_stepper
      - delay: 2s
      - logger.log: "Motor ready!"
