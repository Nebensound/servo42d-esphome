# Comprehensive example showing all ServoXXD features
# This demonstrates the complete YAML API with all available settings and actions

esphome:
  name: servoxxd-comprehensive
  friendly_name: "ServoXXD Comprehensive Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

# Load component from GitHub
external_components:
  - source: github://Nebensound/servoxxd-esphome
    components: [servoxxd]

# RS485 Communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

# Modbus controller
modbus:
  id: modbus1
  uart_id: uart_bus

# ServoXXD Stepper Motor with all configuration options
stepper:
  - platform: servoxxd
    id: my_stepper
    modbus_id: modbus1
    address: 0x01

    # Basic stepper configuration (Required)
    steps_per_revolution: 3200  # 200 steps/rev × 16 microsteps
    servo_type: SERVO42D         # SERVO28D | SERVO35D | SERVO42D | SERVO57D
    
    # Optional settings
    microsteps: 16               # 1-256 subdivisions
    control_mode: SR_VFOC        # SR_OPEN (400 RPM) | SR_CLOSE (1500 RPM) | SR_VFOC (3000 RPM, best)
    speed: 1000 steps/s          # Can use: steps/s, RPM, rev/s, deg/s, deg/min, deg/h
    acceleration: 500 steps/s^2  # Can use: steps/s^2, RPM/s, rev/s^2
    mode: POSITION               # POSITION | SPEED

    # Current settings
    # Defaults based on servo_type: 28D=600mA, 35D=800mA, 42D=1600mA, 57D=3200mA
    # Max: 28D/35D/42D=3000mA, 57D=5200mA
    working_current: 1.5A        # or 1500mA
    holding_current_percent: 30% # Range: 10%-90% (only for SR_OPEN/SR_CLOSE, not VFOC)

    # EN pin behavior
    en_pin_active: ALWAYS        # LOW | HIGH | ALWAYS
    auto_screen_off: true        # Auto-off display after 15s
    lock_keys_at_startup: false  # Lock display buttons

    # Homing configuration (optional)
    homing:
      mode: VIRTUAL              # ENDSTOP | SENSORLESS | VIRTUAL
      direction: NEAREST         # CW | CCW | NEAREST (NEAREST only for VIRTUAL)
      speed: 600 rpm             # Homing speed
      at_startup: false          # Run homing on boot
    # use_virtual_home: true
    # virtual_home_angle: 180     # 0-359 degrees - motor returns to this angle on power-up
    # homing_speed: 1000          # RPM
    # homing_direction: NEAREST   # CW, CCW, or NEAREST (shortest path for virtual homing)

    # Display settings
    auto_screen_off: true # Turn off screen after 15 seconds
    lock_keys_at_startup: false # Prevent button presses on motor display

# Position sensor to monitor motor position
sensor:
  - platform: template
    name: "Stepper Position"
    id: stepper_position
    lambda: |-
      return id(my_stepper).current_position;
    update_interval: 100ms
    unit_of_measurement: "steps"

# Buttons to demonstrate all available actions
button:
  # Basic motor control
  - platform: template
    name: "Enable Motor"
    on_press:
      - stepper.enable: my_stepper

  - platform: template
    name: "Disable Motor"
    on_press:
      - stepper.disable: my_stepper

  # Movement actions
  - platform: template
    name: "Move +1000 steps"
    on_press:
      - stepper.set_target:
          id: my_stepper
          target: !lambda "return id(my_stepper).current_position + 1000;"

  - platform: template
    name: "Move -1000 steps"
    on_press:
      - stepper.set_target:
          id: my_stepper
          target: !lambda "return id(my_stepper).current_position - 1000;"

  - platform: template
    name: "Run Continuous CW"
    on_press:
      - stepper.run_continuous:
          id: my_stepper
          speed: 10 RPM
          direction: CW

  - platform: template
    name: "Run Continuous CCW"
    on_press:
      - stepper.run_continuous:
          id: my_stepper
          speed: 10 RPM
          direction: CCW

  - platform: template
    name: "Stop Motor"
    on_press:
      - stepper.stop: my_stepper

  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: my_stepper

  # Homing and calibration
  - platform: template
    name: "Home Motor"
    on_press:
      - stepper.home: my_stepper

  - platform: template
    name: "Reset Position (Zero)"
    on_press:
      - stepper.reset_position: my_stepper

  - platform: template
    name: "Calibrate Motor"
    on_press:
      - stepper.calibrate: my_stepper

  # Recovery actions
  - platform: template
    name: "Release Protection"
    on_press:
      - stepper.release_protection: my_stepper

  - platform: template
    name: "Restart Motor"
    on_press:
      - stepper.restart: my_stepper

  # Runtime configuration changes
  - platform: template
    name: "Set Control Mode: SR_VFOC"
    on_press:
      - stepper.set_control_mode:
          id: my_stepper
          control_mode: SR_VFOC

  - platform: template
    name: "Set Control Mode: SR_CLOSE"
    on_press:
      - stepper.set_control_mode:
          id: my_stepper
          control_mode: SR_CLOSE
  
  - platform: template
    name: "Set Working Current: 2000mA"
    on_press:
      - stepper.set_working_current:
          id: my_stepper
          current: 2000

  - platform: template
    name: "Set Holding Current: 40%"
    on_press:
      - stepper.set_holding_current_percent:
          id: my_stepper
          percent: 40

  - platform: template
    name: "Set Microstepping: 32"
    on_press:
      - stepper.set_microstepping:
          id: my_stepper
          subdivision: 32

  # Display control
  - platform: template
    name: "Lock Keys"
    on_press:
      - stepper.key_lock: my_stepper

  - platform: template
    name: "Unlock Keys"
    on_press:
      - stepper.key_unlock: my_stepper
