# Multi-Motor ServoXXD Example
#
# This example shows how to control multiple motors on the same RS485 bus
# Each motor must have a unique MODBUS address configured via the display

esphome:
  name: servoxxd-multi
  friendly_name: "ServoXXD Multi-Motor Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Load component from GitHub
external_components:
  - source: github://Nebensound/servoxxd-esphome
    components: [servoxxd]

# Enable logging
logger:
  level: DEBUG

# Single UART for all motors on the same RS485 bus
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller (shared by all motors)
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Multiple ServoXXD motors with different addresses
stepper:
  # Motor 1 - X-Axis
  - platform: servoxxd
    id: motor_x
    steps_per_revolution: 3200  # 200 steps × 16 microsteps
    servo_type: SERVO42D         # Set per motor if different models are used
    control_mode: SR_VFOC
    speed: 2000 steps/s
    acceleration: 800 steps/s^2
    mode: POSITION
    modbus_id: modbus_bus
    address: 0x01

  # Motor 2 - Y-Axis
  - platform: servoxxd
    id: motor_y
    steps_per_revolution: 3200  # 200 steps × 16 microsteps
    servo_type: SERVO42D         # SERVO28D | SERVO35D | SERVO42D | SERVO57D
    control_mode: SR_VFOC
    speed: 2000 steps/s
    acceleration: 800 steps/s^2
    mode: POSITION
    modbus_id: modbus_bus
    address: 0x02

  # Motor 3 - Z-Axis (could be a different model)
  - platform: servoxxd
    id: motor_z
    steps_per_revolution: 3200  # 200 steps × 16 microsteps
    servo_type: SERVO57D         # Example: using a larger motor
    control_mode: SR_VFOC
    speed: 1000 steps/s
    acceleration: 500 steps/s^2
    mode: POSITION
    modbus_id: modbus_bus
    address: 0x03

# Example: Control buttons for each motor
button:
  - platform: template
    name: "Home X-Axis"
    on_press:
      - stepper.home: motor_x

  - platform: template
    name: "Home Y-Axis"
    on_press:
      - stepper.home: motor_y

  - platform: template
    name: "Home Z-Axis"
    on_press:
      - stepper.home: motor_z

  - platform: template
    name: "Home All Axes"
    on_press:
      - stepper.home: motor_x
      - delay: 5s # Wait for X to finish
      - stepper.home: motor_y
      - delay: 5s # Wait for Y to finish
      - stepper.home: motor_z
